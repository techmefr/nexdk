name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build nexdk core
        run: pnpm build

      - name: Build packages
        run: pnpm --filter "./packages/**" build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test nexdk core
        run: pnpm test

      - name: Test packages
        run: pnpm --filter "./packages/**" test
