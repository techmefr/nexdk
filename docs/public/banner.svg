  <text x="74" y="290" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="26" fill="#e2e8f0">sdk.<tspan fill="#38bdf8">[driver]</tspan>.<tspan fill="#a5b4fc">[resource]</tspan>.<tspan fill="#86efac">[method]</tspan>()</text>
